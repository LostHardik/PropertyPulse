services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA:?Set ACCEPT_EULA=Y after reviewing Microsoft SQL Server license terms}"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - propertypulse_sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_ENCRYPT: "false"
      DB_TRUST_CERT: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  propertypulse_sql:
